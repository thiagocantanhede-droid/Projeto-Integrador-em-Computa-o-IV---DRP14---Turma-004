{% extends 'index.html' %}

{% load static %}

{% block content %}

<div class="br-list" role="list">
    <div class="header">
        <div class="title">Notebooks</div>

    </div><span class="br-divider"></span>
    {% for item in itens %}
    <div class="br-item py-4" role="listitem">
        <div class="row align-items-center">
            <span class="br-avatar mr-3" style="" title="Fulano da Silva"><span class="content"><img
                        src="{% static '/images/laptop.svg' %}" alt="Avatar" /></span></span>
            <div class="col"><a href="{% url 'Página do Notebook' item.id %}"><strong>{{item}} | Tombamento nº {{item.patrimônio}}</strong></a>
            </div>
        </div><br>
        <div class="row align-items-center">
            <span class="br-avatar mr-3" style="" title="Fulano da Silva"><span class="content"><img
                        src="{% static '/images/user.svg' %}" alt="Avatar"/></span>
            <strong style="margin-left: 24px;">Cautela: {{item.cautela.username}}</strong>
        </div>
    </div><span class="br-divider"></span>
    {% endfor %}
</div>
{% if itens %}
<div class="header-login">
    <div class="header-sign-in" style="">
        <a class="br-sign-in small" href="{% url 'generate-sheet-lista-notebooks' %}">
            <span class="d-sm-inline">Exportar Planilha</span>
        </a>
    </div>
</div>
<br>
<div class="header-login">
    <div class="header-sign-in" style="">
        <a class="br-sign-in small" href="{% url 'generate-pdf-lista-notebooks' %}">
            <span class="d-sm-inline">Imprimir</span>
        </a>
    </div>
</div>
{% endif %}
<style>
    .br-list {
        background-color: var(--background);
    }


    .br-list.horizontal {
        display: flex;
        flex-wrap: wrap;
    }

    .br-list.horizontal>.header {
        flex-grow: 1;
        width: 100%;
    }

    .br-list.horizontal>.header+.br-divider {
        border-top: 1px solid var(--border-color);
        width: 100%;
    }

    .br-list.horizontal>.br-item,
    .br-list.horizontal>.group {
        flex: 1;
        height: auto;
        min-height: 56px;
        width: auto;
    }

    .br-list.horizontal>.br-item+.br-divider,
    .br-list.horizontal>.group+.br-divider {
        border-width: 0 1px 0 0;
        width: 1px;
    }

    .br-list.horizontal>.br-item.one-line>.content,
    .br-list.horizontal>.group.one-line>.content {
        height: 56px;
    }

    .br-list.horizontal>.br-item.two-lines>.content,
    .br-list.horizontal>.group.two-lines>.content {
        height: 72px;
    }

    .br-list.horizontal>.br-item.three-lines>.content,
    .br-list.horizontal>.group.three-lines>.content {
        height: 6em;
    }

    .br-list.horizontal[data-toggle]>.br-item,
    .br-list.horizontal.toggle>.br-item {
        display: block;
    }

    .br-list .br-item {
        text-align: left;
        width: 100%;
    }

    .br-list .br-item .svg-inline--fa,
    .br-list .br-item .fa,
    .br-list .br-item .fab,
    .br-list .br-item .fad,
    .br-list .br-item .fal,
    .br-list .br-item .far,
    .br-list .br-item .fas {
        text-align: center;
    }

    .br-list .br-item>.content {
        align-items: var(--spacing-vertical-top);
        display: flex;
    }

    .br-list .br-item>.content>.content {
        flex: 1;
    }

    .br-list .br-item .content:hover button.br-button {
        background-image: linear-gradient(rgba(var(--interactive-rgb), var(--hover)), rgba(var(--interactive-rgb), var(--hover)));
    }

    .br-list .br-item[data-toggle] {
        cursor: pointer;
    }

    .br-list .br-item[data-toggle]~.br-list .br-item {
        padding: var(--spacing-scale-base) var(--spacing-scale-3x);
    }

    .br-list .br-list {
        overflow: hidden;
        transition: all 400ms ease-in-out;
    }

    .br-list .header {
        align-items: var(--spacing-vertical-center);
        display: flex;
        font-size: var(--font-size-scale-base);
        font-weight: var(--font-weight-bold);
        justify-content: space-between;
        padding: var(--spacing-scale-base) var(--spacing-scale-2x);
    }

    .br-list[data-one-line] .br-item,
    .br-list[data-one-line] .br-list .br-item {
        height: 2em;
    }

    .br-list[data-one-line] .br-item .content,
    .br-list[data-one-line] .br-list .br-item .content {
        height: auto;
        overflow: hidden;
        padding: 0 var(--spacing-scale-2x);
        text-overflow: unset;
        white-space: initial;
    }

    .br-list[data-two-lines] .br-item,
    .br-list[data-two-lines] .br-list .br-item {
        height: 4em;
    }

    .br-list[data-two-lines] .br-item .content,
    .br-list[data-two-lines] .br-list .br-item .content {
        height: auto;
        overflow: hidden;
        padding: 0 var(--spacing-scale-2x);
        text-overflow: unset;
        white-space: initial;
    }

    .br-list[data-three-lines] .br-item,
    .br-list[data-three-lines] .br-list .br-item {
        height: 6em;
    }

    .br-list[data-three-lines] .br-item .content,
    .br-list[data-three-lines] .br-list .br-item .content {
        height: auto;
        overflow: hidden;
        padding: 0 var(--spacing-scale-2x);
        text-overflow: unset;
        white-space: initial;
    }

    /*# sourceMappingURL=list.css.map*/
</style>
<style>
    .br-avatar {
        --avatar-size: var(--avatar-small);
        --avatar-icon-size: var(--avatar-icon-small);
        --avatar-text-size: var(--avatar-text-small);
        --avatar-small: 40px;
        --avatar-medium: 100px;
        --avatar-large: 160px;
        --avatar-icon-small: var(--icon-size-2x);
        --avatar-icon-medium: var(--icon-size-5x);
        --avatar-icon-large: var(--icon-size-8x);
        --avatar-text-small: var(--font-size-scale-up-03);
        --avatar-text-medium: var(--font-size-scale-up-07);
        --avatar-text-large: var(--font-size-scale-up-11);
        align-items: center;
        background-color: transparent;
        border: 0;
        display: inline-flex;
        font-size: var(--avatar-text-size);
        font-weight: var(--font-weight-bold);
        justify-content: center;
        line-height: var(--avatar-size);
        vertical-align: middle;
    }

    .br-avatar .content {
        align-items: center;
        background-color: var(--blue-10);
        border-radius: 50%;
        color: var(--blue-warm-20);
        display: inline-flex;
        font-size: var(--avatar-text-size);
        height: var(--avatar-size);
        justify-content: center;
        overflow: hidden;
        text-align: center;
        text-transform: uppercase;
        vertical-align: inherit;
        width: var(--avatar-size);
    }

    .br-avatar .content img {
        height: var(--avatar-size);
        vertical-align: inherit;
        width: var(--avatar-size);
    }

    .br-avatar .content .svg-inline--fa,
    .br-avatar .content .fa,
    .br-avatar .content .fab,
    .br-avatar .content .fad,
    .br-avatar .content .fal,
    .br-avatar .content .far,
    .br-avatar .content .fas {
        --icon-size: var(--avatar-icon-size);
        margin-top: 0.25em;
    }

    .br-avatar.is-small,
    .br-avatar.small,
    .br-avatar[small] {
        --avatar-size: var(--avatar-small);
        --avatar-icon-size: var(--avatar-icon-small);
        --avatar-text-size: var(--avatar-text-small);
    }

    .br-avatar.is-medium,
    .br-avatar.medium,
    .br-avatar[medium] {
        --avatar-size: var(--avatar-medium);
        --avatar-icon-size: var(--avatar-icon-medium);
        --avatar-text-size: var(--avatar-text-medium);
    }

    .br-avatar.is-large,
    .br-avatar.large,
    .br-avatar[large] {
        --avatar-size: var(--avatar-large);
        --avatar-icon-size: var(--avatar-icon-large);
        --avatar-text-size: var(--avatar-text-large);
    }

    .br-avatar-action {
        background: transparent;
        border: 0;
    }

    .br-avatar-action:not(:disabled):hover {
        background-image: linear-gradient(rgba(var(--interactive-rgb), var(--hover)), rgba(var(--interactive-rgb), var(--hover)));
    }

    .br-avatar-action:focus {
        outline: none;
    }

    .br-avatar-action.focus-visible,
    .br-avatar-action:focus-visible {
        outline-color: var(--focus);
        outline-offset: var(--focus-offset);
        outline-style: var(--focus-style);
        outline-width: var(--focus-width);
    }

    .br-avatar[data-toggle=dropdown]:focus {
        outline: none;
    }

    .br-avatar[data-toggle=dropdown].focus-visible,
    .br-avatar[data-toggle=dropdown]:focus-visible {
        outline-color: var(--focus);
        outline-offset: var(--focus-offset);
        outline-style: var(--focus-style);
        outline-width: var(--focus-width);
    }

    .br-avatar .image,
    .br-avatar .letter {
        align-items: center;
        background-color: var(--blue-10);
        border-radius: 50%;
        color: var(--blue-warm-20);
        display: inline-flex;
        font-size: var(--avatar-text-size);
        height: var(--avatar-size);
        justify-content: center;
        overflow: hidden;
        text-align: center;
        text-transform: uppercase;
        vertical-align: inherit;
        width: var(--avatar-size);
    }

    .br-avatar .image img,
    .br-avatar .letter img {
        height: var(--avatar-size);
        vertical-align: inherit;
        width: var(--avatar-size);
    }

    .br-avatar .image .svg-inline--fa,
    .br-avatar .image .fa,
    .br-avatar .image .fab,
    .br-avatar .image .fad,
    .br-avatar .image .fal,
    .br-avatar .image .far,
    .br-avatar .image .fas,
    .br-avatar .letter .svg-inline--fa,
    .br-avatar .letter .fa,
    .br-avatar .letter .fab,
    .br-avatar .letter .fad,
    .br-avatar .letter .fal,
    .br-avatar .letter .far,
    .br-avatar .letter .fas {
        --icon-size: var(--avatar-icon-size);
        margin-top: 0.25em;
    }

    /*# sourceMappingURL=avatar.css.map*/
</style>

{% endblock content %}
