<html>

<head>

    <style>
        body {
            font-family: 'lato', sans-serif;
        }

        .container {
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 10px;
            padding-right: 10px;
        }

        h2 {
            font-size: 26px;
            margin: 20px 0;
            text-align: center;

            small {
                font-size: 0.5em;
            }
        }

        .responsive-table {
            li {
                border-radius: 3px;
                padding: 25px 30px;
                display: flex;
                justify-content: space-between;
                margin-bottom: 25px;
            }

            .table-header {
                background-color: #95A5A6;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 0.03em;
            }

            .table-row {
                background-color: #ffffff;
                box-shadow: 0px 0px 9px 0px rgba(0, 0, 0, 0.1);
            }

            .col-1 {
                flex-basis: 20%;
            }

            .col-2 {
                flex-basis: 20%;
            }

            .col-3 {
                flex-basis: 20%;
                padding-left: 5px;
                padding-right: 15px;
            }

            .col-4 {
                flex-basis: 20%;
                padding-left: 15px;

            }

            .col-5 {
                flex-basis: 20%;
            }


            @media all and (max-width: 767px) {
                .table-header {
                    display: none;
                }


                li {
                    display: block;
                }

                .col {

                    flex-basis: 100%;
                    padding-left: 10px;
                    padding-right: 10px;

                }

                .col {
                    display: flex;
                    padding: 20px 0;

                    &:before {
                        color: #6C7A89;
                        padding-right: 20px;
                        content: attr(data-label);
                        flex-basis: 50%;
                        text-align: right;
                    }
                }
            }
        }
    </style>

</head>

<div class="container">
    <ul class="responsive-table">
        <li class="table-header">
            <div class="col col-1">Marca</div>
            <div class="col col-2">Patrimônio</div>
            <div class="col col-3">Documento</div>
            <div class="col col-4">Cautela</div>
            <div class="col col-5">Modelo</div>
        </li>
        {% for notebook in notebooks %}
        <li class="table-row">
            <div class="col col-1" data-label="Modelo"><strong>{{notebook.marca}}</strong></div>
            <div class="col col-2" data-label="Patrimônio">{{notebook.patrimônio}}</div>
            <div class="col col-3" data-label="Documento">{{notebook.documento}}</div>
            <div class="col col-4" data-label="Cautela">{{notebook.cautela.username}}</div>
            <div class="col col-5" data-label="Número">{{notebook.modelo}}</div>
        </li>
        <hr style="border-width: 1px;">
        {% endfor %}

    </ul>
</div>




</html>
